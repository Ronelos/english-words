<style>
/* Layout: one card split in two flag-coloured halves (English blue | Ukrainian sunflower), picture badge sitting on the seam */
:root {
  --bg: #EDF2FA;
  --surface: #FFFFFF;
  --ink: #14213D;
  --muted: #5A6A88;
  --line: #D3DCEC;
  --en: #1E5BC6;
  --en-ink: #FFFFFF;
  --en-soft: rgba(255,255,255,.16);
  --uk: #FFCC2E;
  --uk-ink: #2A2000;
  --uk-soft: rgba(42,32,0,.10);
  --warn-bg: #FFF4D6;
  --warn-ink: #6A4B00;
  --shadow: 0 18px 40px -18px rgba(20,33,61,.35);
  --display: "Unbounded", "Nunito", system-ui, sans-serif;
  --body: "Nunito", system-ui, "Segoe UI", Roboto, sans-serif;
  --ipa: "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1322; --surface: #18223B; --ink: #E9EFFC; --muted: #98A8C8; --line: #27334F;
    --en: #2A61C8; --en-ink: #FFFFFF; --en-soft: rgba(255,255,255,.14);
    --uk: #E3B425; --uk-ink: #1F1800; --uk-soft: rgba(31,24,0,.14);
    --warn-bg: #3A2F12; --warn-ink: #FFE29A;
    --shadow: 0 18px 40px -18px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1322; --surface: #18223B; --ink: #E9EFFC; --muted: #98A8C8; --line: #27334F;
  --en: #2A61C8; --en-ink: #FFFFFF; --en-soft: rgba(255,255,255,.14);
  --uk: #E3B425; --uk-ink: #1F1800; --uk-soft: rgba(31,24,0,.14);
  --warn-bg: #3A2F12; --warn-ink: #FFE29A;
  --shadow: 0 18px 40px -18px rgba(0,0,0,.7);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--en); outline-offset: 3px; }

.app { max-width: 1500px; min-height: 100%; margin: 0 auto; padding-block: 18px 24px; padding-inline: clamp(16px, 2.5vw, 40px); display: flex; flex-direction: column; gap: 14px; }
.app > .card { flex: 1; }

header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.brand h1 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 1.35rem; letter-spacing: -.01em; }
.brand h1 .dot-en { color: var(--en); }
.brand h1 .dot-uk { color: var(--uk); -webkit-text-stroke: .5px var(--uk-ink); }
.brand p { margin: 2px 0 0; color: var(--muted); font-weight: 600; font-size: .9rem; }
.toggles { display: flex; gap: 8px; flex-wrap: wrap; }
.toggle { display: inline-flex; align-items: center; gap: 8px; border: 2px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px 7px 8px; font-weight: 800; font-size: .9rem; cursor: pointer; }
.toggle .knob { width: 34px; height: 20px; border-radius: 999px; background: var(--line); position: relative; transition: background .2s; flex: none; }
.toggle .knob::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); transition: transform .2s; }
.toggle[aria-pressed="true"] .knob { background: var(--en); }
.toggle[aria-pressed="true"] .knob::after { transform: translateX(14px); }

.warn { background: var(--warn-bg); color: var(--warn-ink); border-radius: 16px; padding: 12px 16px; font-weight: 700; font-size: .92rem; line-height: 1.4; }

.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
.chip { flex: none; border: 2px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-weight: 800; font-size: .95rem; cursor: pointer; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.search { position: relative; }
.search input { width: 100%; border: 2px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 16px; padding: 12px 16px 12px 44px; font: 700 1rem var(--body); }
.search svg { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.results { position: absolute; z-index: 5; left: 0; right: 0; top: calc(100% + 6px); background: var(--surface); border: 2px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 6px; display: flex; flex-direction: column; }
.results button { display: flex; align-items: center; gap: 12px; text-align: left; border: 0; background: none; padding: 9px 10px; border-radius: 10px; cursor: pointer; font-weight: 800; }
.results button:hover, .results button:focus-visible { background: var(--bg); }
.results .r-pic { width: 32px; text-align: center; font-size: 1.4rem; flex: none; }
.results .r-uk { color: var(--muted); font-weight: 700; }
.results .empty { padding: 10px; color: var(--muted); font-weight: 700; }

.card { position: relative; display: grid; grid-template-columns: 1fr 1fr; border-radius: 30px; overflow: hidden; min-height: clamp(330px, 50vh, 460px); box-shadow: var(--shadow); touch-action: pan-y; }
.half { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 36px 24px; text-align: center; min-width: 0; position: relative; }
.half.en { background: var(--en); color: var(--en-ink); padding-right: 88px; }
.half.uk { background: var(--uk); color: var(--uk-ink); padding-left: 88px; }
.lang { font-family: var(--display); font-weight: 600; font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; opacity: .8; }
.word { font-weight: 900; font-size: clamp(2.1rem, 5.6vw, 3.5rem); line-height: 1.05; overflow-wrap: anywhere; text-wrap: balance; }
.ipa { font-family: var(--ipa); font-size: 1.15rem; opacity: .85; min-height: 1.4em; }
.btns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 6px; }
.say { display: inline-flex; align-items: center; gap: 10px; border: 0; border-radius: 999px; padding: 14px 22px; font-weight: 900; font-size: 1.05rem; cursor: pointer; transition: transform .15s; }
.say:active { transform: scale(.96); }
.en .say { background: var(--en-ink); color: var(--en); }
.uk .say { background: var(--uk-ink); color: var(--uk); }
.en .say.slow { background: var(--en-soft); color: var(--en-ink); }
.say.playing { animation: pulse .9s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.06); } }

.pic { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 136px; height: 136px; border-radius: 50%; background: var(--surface); border: 7px solid var(--bg); display: grid; place-items: center; font-size: 72px; line-height: 1; box-shadow: var(--shadow); z-index: 2; user-select: none; }
.pic .num { font-family: var(--display); font-weight: 800; font-size: 54px; color: var(--ink); }
.pic .swatch { width: 84px; height: 84px; border-radius: 50%; border: 3px solid var(--line); }

.star { position: absolute; top: 14px; right: 14px; width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--uk-soft); color: var(--uk-ink); display: grid; place-items: center; cursor: pointer; z-index: 3; }
.star svg { width: 26px; height: 26px; }
.star[aria-pressed="true"] svg { fill: currentColor; }

.veil { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; padding-left: 88px; z-index: 1; }
.uk.veiled .veil { display: flex; }
.uk.veiled > :not(.veil) { filter: blur(14px); opacity: .5; pointer-events: none; }
.veil button { border: 3px dashed var(--uk-ink); background: transparent; color: var(--uk-ink); border-radius: 999px; padding: 14px 22px; font-weight: 900; font-size: 1.05rem; cursor: pointer; }

.card.anim-l .half > *, .card.anim-r .half > * { animation: slideIn .28s ease-out; }
.card.anim-r .half > * { --from: 24px; }
.card.anim-l .half > * { --from: -24px; }
@keyframes slideIn { from { opacity: 0; transform: translateX(var(--from)); } }
.card .veil { animation: none !important; }

nav { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
.navbtn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 2px solid var(--line); background: var(--surface); border-radius: 999px; padding: 14px 20px; font-weight: 900; font-size: 1.05rem; cursor: pointer; }
.navbtn.next { background: var(--ink); color: var(--bg); border-color: var(--ink); justify-self: end; }
.navbtn.prev { justify-self: start; }
.mid { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.count { font-family: var(--display); font-weight: 600; font-size: 1rem; font-variant-numeric: tabular-nums; }
.learned { color: var(--muted); font-weight: 700; font-size: .85rem; }
.shuffle { border: 0; background: none; color: var(--muted); font-weight: 800; font-size: .85rem; cursor: pointer; padding: 4px 8px; border-radius: 8px; display: inline-flex; gap: 6px; align-items: center; }
.shuffle[aria-pressed="true"] { color: var(--en); }
.hint { text-align: center; color: var(--muted); font-size: .85rem; font-weight: 600; margin: 0; }

@media (min-width: 900px) and (min-height: 640px) {
  .word { font-size: clamp(3rem, 5.2vw, 6rem); }
  .ipa { font-size: clamp(1.15rem, 1.6vw, 1.7rem); }
  .lang { font-size: .85rem; }
  .say { padding: 18px 28px; font-size: 1.25rem; }
  .pic { width: clamp(150px, 15vw, 230px); height: clamp(150px, 15vw, 230px); font-size: clamp(80px, 8vw, 124px); border-width: 9px; }
  .pic .num { font-size: clamp(60px, 6vw, 96px); }
  .pic .swatch { width: 62%; height: 62%; }
  .half.en { padding-right: clamp(100px, 9vw, 140px); }
  .half.uk { padding-left: clamp(100px, 9vw, 140px); }
  .veil { padding-left: clamp(100px, 9vw, 140px); }
}
.fs svg { width: 18px; height: 18px; }
@media (max-width: 640px) {
  .card { grid-template-columns: 1fr; min-height: 0; }
  .half { padding: 28px 20px; gap: 10px; }
  .half.en { padding-right: 20px; padding-bottom: 74px; }
  .half.uk { padding-left: 20px; padding-top: 74px; }
  .veil { padding-left: 0; padding-top: 60px; }
  .pic { width: 112px; height: 112px; font-size: 58px; border-width: 6px; }
  .pic .num { font-size: 44px; }
  .pic .swatch { width: 68px; height: 68px; }
  .navbtn { padding: 12px 16px; }
  .navbtn .t { display: none; }
  .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .card.anim-l .half > *, .card.anim-r .half > *, .say.playing { animation: none; }
}
</style>

  </section>

  <nav>

  </nav>
  <p class="hint">Клавіші ← → гортають слова. На телефоні можна гортати пальцем.</p>

const topics = DATA.map(([name, en, icon, raw], ti) => ({
  name, en, icon,
  words: raw.trim().split("\n").map(line => {
    const [pic, w, ipa, uk] = line.split("|").map(s => s.trim());
    return { pic, en: w, ipa, uk, ti };
  })
}));
const ALL = topics.flatMap(t => t.words);
const $ = s => document.querySelector(s);

/* ---------- state ---------- */
const KEY = "my-first-words-v1";
let state = { topic: 0, idx: 0, hide: false, auto: false, learned: [] };
try { Object.assign(state, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
const learned = new Set(state.learned || []);
let order = null;          // shuffled index order for current list
let revealed = false;
function save() {
  try { localStorage.setItem(KEY, JSON.stringify({ topic: state.topic, idx: state.idx, hide: state.hide, auto: state.auto, learned: [...learned] })); } catch (e) {}
}
function baseList() { return state.topic < 0 ? ALL : topics[state.topic].words; }
function list() { const b = baseList(); return order ? order.map(i => b[i]) : b; }
if (state.topic >= topics.length || state.topic < -1) state.topic = 0;
if (state.idx >= baseList().length || state.idx < 0) state.idx = 0;

/* ---------- speech ---------- */
const synth = "speechSynthesis" in window ? window.speechSynthesis : null;
let voices = [];
function loadVoices() { if (synth) { voices = synth.getVoices(); checkVoices(); } }
function pickVoice(lang) {
  const c = voices.filter(v => v.lang.replace("_", "-").toLowerCase().startsWith(lang));
  if (!c.length) return null;
  const score = v => (/natural|online|neural/i.test(v.name) ? 4 : 0) + (/google/i.test(v.name) ? 2 : 0) + (/en-gb/i.test(v.lang.replace("_", "-")) ? 1 : 0);
  return c.sort((a, b) => score(b) - score(a))[0];
}
/* recorded voices: sound/t<topic>.js, loaded per topic; browser voice is the fallback */
const SET = { en: { 0.9: "en", 0.5: "en-slow" }, uk: { 0.9: "uk" } };
const loading = {};
function loadSound(ti) {
  if (window.AUDIO_T && window.AUDIO_T[ti]) return Promise.resolve();
  if (!loading[ti]) loading[ti] = new Promise(res => {
    const s = document.createElement("script");
    s.src = `sound/t${ti}.js`;
    s.charset = "utf-8";
    s.onload = res;
    s.onerror = () => { delete loading[ti]; res(); };
    document.head.appendChild(s);
  });
  return loading[ti];
}
let player = null;
async function speak(text, lang, rate, btn) {
  if (player) { player.pause(); player = null; }
  if (synth) synth.cancel();
  document.querySelectorAll(".say.playing").forEach(b => b.classList.remove("playing"));
  const w = list()[state.idx];
  if (btn) btn.classList.add("playing");
  // play straight from the click when the topic is already loaded (phones block audio started later)
  if (!(window.AUDIO_T && window.AUDIO_T[w.ti])) await loadSound(w.ti);
  const bundle = window.AUDIO_T && window.AUDIO_T[w.ti];
  const b64 = bundle && bundle[SET[lang][rate]] && bundle[SET[lang][rate]][text];
  if (b64) {
    player = new Audio("data:audio/mpeg;base64," + b64);
    if (btn) btn.classList.add("playing");
    const done = () => btn && btn.classList.remove("playing");
    player.onended = done;
    player.onerror = () => { done(); player = null; speakSynth(text, lang, rate, btn); };
    player.play().catch(done);
    return;
  }
  speakSynth(text, lang, rate, btn);
}
function speakSynth(text, lang, rate, btn) {
  if (!synth) return;
  const u = new SpeechSynthesisUtterance(text.replace(/…/g, ""));
  u.lang = lang === "en" ? "en-GB" : "uk-UA";
  const v = pickVoice(lang);
  if (v) { u.voice = v; u.lang = v.lang; }
  u.rate = rate;
  if (btn) btn.classList.add("playing");
  u.onend = u.onerror = () => btn && btn.classList.remove("playing");
  synth.speak(u);
}
function checkVoices() {
  const warn = $("#warn");
  if (window.AUDIO_T) { warn.hidden = true; return; }
  if (!synth) { warn.textContent = "Цей браузер не вміє озвучувати слова. Відкрийте сторінку в Microsoft Edge, Chrome або Safari."; warn.hidden = false; return; }
  if (!voices.length) return;
  if (!pickVoice("uk")) {
    warn.textContent = "На цьому пристрої не знайдено українського голосу, тому переклад може не озвучуватись. На комп’ютері відкрийте сторінку в Microsoft Edge. На телефоні додайте українську мову в налаштуваннях синтезу мовлення.";
    warn.hidden = false;
  } else warn.hidden = true;
}
if (synth) { loadVoices(); synth.onvoiceschanged = loadVoices; setTimeout(loadVoices, 1500); } else checkVoices();

/* ---------- render ---------- */
function renderChips() {
  const chips = $("#chips");
  const all = [{ i: -1, label: "Усі слова", icon: "📚" }].concat(topics.map((t, i) => ({ i, label: t.name, icon: t.icon })));
  chips.innerHTML = all.map(c => `<button class="chip" data-i="${c.i}" aria-pressed="${c.i === state.topic}"><span aria-hidden="true">${c.icon}</span>${c.label}</button>`).join("");
}
function picHTML(p) {
  if (p.startsWith("c:")) return `<span class="swatch" style="background:${p.slice(2)}"></span>`;
  if (/^\d+$/.test(p)) return `<span class="num">${p}</span>`;
  return p;
}
function render(dir) {
  const L = list();
  const w = L[state.idx];
  $("#enWord").textContent = w.en;
  $("#ipa").textContent = w.ipa ? `[${w.ipa}]` : "";
  $("#ukWord").textContent = w.uk;
  $("#pic").innerHTML = picHTML(w.pic);
  $("#count").textContent = `${state.idx + 1} / ${L.length}`;
  const n = L.filter(x => learned.has(x.en)).length;
  $("#learned").textContent = `★ вивчено ${n} з ${L.length}`;
  $("#star").setAttribute("aria-pressed", learned.has(w.en));
  revealed = false;
  $("#ukHalf").classList.toggle("veiled", state.hide);
  $("#tHide").setAttribute("aria-pressed", state.hide);
  $("#tAuto").setAttribute("aria-pressed", state.auto);
  $("#shuffle").setAttribute("aria-pressed", !!order);
  document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", +c.dataset.i === state.topic));
  const card = $("#card");
  card.classList.remove("anim-l", "anim-r");
  if (dir) { void card.offsetWidth; card.classList.add(dir > 0 ? "anim-r" : "anim-l"); }
  loadSound(w.ti).then(checkVoices);
  save();
}
function go(d) {
  const L = list().length;
  state.idx = (state.idx + d + L) % L;
  render(d);
  if (state.auto) speak(list()[state.idx].en, "en", 0.9, $("#sayEn"));
}
function setTopic(i) {
  state.topic = i; state.idx = 0; order = null;
  render(1);
  const active = document.querySelector(`.chip[data-i="${i}"]`);
  if (active) active.scrollIntoView({ block: "nearest", inline: "center", behavior: "smooth" });
}

/* ---------- events ---------- */
$("#chips").addEventListener("click", e => { const b = e.target.closest(".chip"); if (b) setTopic(+b.dataset.i); });
$("#prev").onclick = () => go(-1);
$("#next").onclick = () => go(1);
$("#sayEn").onclick = e => speak(list()[state.idx].en, "en", 0.9, e.currentTarget);
$("#sayEnSlow").onclick = e => speak(list()[state.idx].en, "en", 0.5, e.currentTarget);
$("#sayUk").onclick = e => speak(list()[state.idx].uk, "uk", 0.9, e.currentTarget);
$("#reveal").onclick = () => { revealed = true; $("#ukHalf").classList.remove("veiled"); };
$("#star").onclick = () => {
  const w = list()[state.idx];
  learned.has(w.en) ? learned.delete(w.en) : learned.add(w.en);
  const keepVeil = state.hide && !revealed;
  render(0);
  if (!keepVeil) $("#ukHalf").classList.remove("veiled");
};
$("#tHide").onclick = () => { state.hide = !state.hide; render(0); };
$("#tAuto").onclick = () => { state.auto = !state.auto; render(0); };
$("#shuffle").onclick = () => {
  const cur = list()[state.idx];
  if (order) { order = null; state.idx = baseList().indexOf(cur); }
  else {
    order = baseList().map((_, i) => i);
    for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
    state.idx = 0;
  }
  render(1);
};
/* full screen (desktop browsers) */
const fsBtn = $("#fs");
if (document.fullscreenEnabled && matchMedia("(pointer: fine)").matches) fsBtn.hidden = false;
fsBtn.onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  else document.documentElement.requestFullscreen().catch(() => {});
};
document.addEventListener("fullscreenchange", () => {
  const on = !!document.fullscreenElement;
  $("#fsText").textContent = on ? "Вийти з повного екрана" : "На весь екран";
});
document.addEventListener("keydown", e => {
  if (e.target.matches("input")) return;
  if (e.key === "ArrowRight") go(1);
  if (e.key === "ArrowLeft") go(-1);
});
let tx = null, ty = null;
$("#card").addEventListener("touchstart", e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
$("#card").addEventListener("touchend", e => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.3) go(dx < 0 ? 1 : -1);
  tx = ty = null;
});

/* search */
const q = $("#q"), results = $("#results");
let found = [];
q.addEventListener("input", () => {
  const s = q.value.trim().toLowerCase();
  if (!s) { results.hidden = true; return; }
  found = ALL.filter(w => w.en.toLowerCase().includes(s) || w.uk.toLowerCase().includes(s)).slice(0, 8);
  results.innerHTML = found.length
    ? found.map((w, i) => `<button data-k="${i}"><span class="r-pic">${w.pic.startsWith("c:") ? "🎨" : /^\d+$/.test(w.pic) ? "🔢" : w.pic}</span><span>${w.en}</span><span class="r-uk">${w.uk}</span></button>`).join("")
    : `<div class="empty">Такого слова поки немає в словнику.</div>`;
  results.hidden = false;
});
results.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const w = found[+b.dataset.k];
  state.topic = w.ti; order = null; state.idx = topics[w.ti].words.indexOf(w);
  q.value = ""; results.hidden = true;
  render(1);
});
q.addEventListener("keydown", e => {
  if (e.key === "Escape") { q.value = ""; results.hidden = true; }
  if (e.key === "Enter" && found.length && !results.hidden) results.querySelector("button")?.click();
});
document.addEventListener("click", e => { if (!e.target.closest(".search")) results.hidden = true; });

renderChips();
render(0);
</script>
